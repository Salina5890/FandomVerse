name: phosphor_flutter
description: Local patched copy of phosphor_flutter 2.1.0 (compatible with Flutter versions where IconData is a final class).
version: 2.1.0
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: PhosphorBold
      fonts:
        - asset: lib/fonts/Phosphor-Bold.ttf
    - family: PhosphorFill
      fonts:
        - asset: lib/fonts/Phosphor-Fill.ttf
    - family: PhosphorLight
      fonts:
        - asset: lib/fonts/Phosphor-Light.ttf
    - family: PhosphorThin
      fonts:
        - asset: lib/fonts/Phosphor-Thin.ttf
    - family: PhosphorRegular
      fonts:
        - asset: lib/fonts/Phosphor.ttf
