name: fandom_verse
description: "Fandom Verse Pocket Edition — Your ultimate fandom companion app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  get: ^4.6.6

  # Local Persistence
  # `hive` itself is not imported directly anywhere — hive_flutter re-exports
  # it and pulls it in transitively, so it doesn't need to be declared here.
  hive_flutter: ^1.1.0

  # Images
  cached_network_image: ^3.4.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.0

  # Fonts
  google_fonts: ^6.2.1

  # Image Picker
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # URL Launcher
  url_launcher: ^6.3.1

  # Share
  share_plus: ^10.1.2

  # Intl
  intl: ^0.20.1

  # Google Maps
  google_maps_flutter: ^2.9.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4

  # Location
  geolocator: ^13.0.1

  # Animations
  flutter_animate: ^4.5.0

  # UUID
  uuid: ^4.5.1

  # Icons (Phosphor — pub.dev)
  phosphor_flutter:
    path: packages/phosphor_flutter
  firebase_core: ^4.15.0
  firebase_storage: ^13.6.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/


